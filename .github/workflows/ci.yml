name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: The page runs the same engine as the command line
        run: node scripts/sync-web.mjs --check
      - name: Tests
        run: node --test
      - name: The command line starts
        run: node bin/tawash.mjs --help && node bin/tawash.mjs candidates example.com --format json > /dev/null
