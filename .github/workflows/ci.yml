# Runs only when started by hand from the Actions tab, so the repository never
# spends GitHub minutes on its own. The same checks run locally before every push.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The page runs the same engine as the command line
        run: node scripts/sync-web.mjs --check
      - name: Tests
        run: node --test
      - name: The command line starts
        run: node bin/tawash.mjs --help && node bin/tawash.mjs candidates example.com --format json > /dev/null
