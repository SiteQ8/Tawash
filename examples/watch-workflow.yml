# Tawash daily watch.
#
# Put this file in .github/workflows/ of a PRIVATE repository. A name that
# borrows a brand is not yet a scam, so candidates stay where a person reviews
# them before anyone else sees them.
#
# It runs every morning after the newly registered list is published, keeps
# its state in the repository so each name is only raised once, and opens an
# issue when something new reaches the alert score.

name: Tawash watch

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tawash-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned to a release tag, so the job runs code you have read.
      - name: Run the watch
        run: npx --yes github:SiteQ8/Tawash#v1.0.0 watch --asli --ct --out reports --alert-at 50

      - name: Open an issue for new candidates
        if: hashFiles('reports/alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Tawash: new lookalikes on $(date -u +%F)" --body-file reports/alert.md

      - name: Keep the reports and the state
        run: |
          git config user.name "tawash-watch"
          git config user.email "tawash-watch@users.noreply.github.com"
          git add reports
          git commit -m "Watch $(date -u +%F)" || echo "nothing new"
          git push
