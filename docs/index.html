<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>طوّاش، كاشف النطاقات الشبيهة في الكويت</title>
  <meta name="description" content="Tawash finds the lookalike domains made to pass for Kuwait's real ones: typos, lookalike characters and Latin spellings of Arabic names, checked live in DNS.">
  <meta name="theme-color" content="#0B2A33">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="طوّاش Tawash">
  <meta property="og:description" content="يكشف طوّاش النطاقات التي صُنعت لتبدو كأنها نطاقات الكويت الأصلية. Finds the domains made to pass for Kuwait's real ones.">
  <meta property="og:image" content="https://tawash.3li.info/og.png">
  <meta property="og:url" content="https://tawash.3li.info/">
  <link rel="canonical" href="https://tawash.3li.info/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Readex+Pro:wght@400;500;600&family=Reem+Kufi:wght@700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <p class="mark"><span class="pearl" aria-hidden="true"></span><span data-t="brand"></span></p>
      <div class="top-links">
        <a href="https://github.com/SiteQ8/Tawash" data-t="source"></a>
        <button type="button" class="lang" id="lang" lang="en">English</button>
      </div>
    </div>
  </header>

  <main id="finder">
    <div class="wrap hero">
      <div class="hero-main">
        <h1 data-t="tagline"></h1>
        <p class="lede" data-t="lede"></p>

        <form id="form" class="probe" novalidate autocomplete="off">
          <label for="domain" class="field-label" data-t="label"></label>
          <div class="probe-frame">
            <input id="domain" name="d" type="text" inputmode="url" spellcheck="false" dir="ltr"
                   autocapitalize="off" autocorrect="off" required aria-describedby="error">
            <button type="submit" id="go" class="go"><span class="go-label" data-t="scan"></span></button>
          </div>
          <p id="error" class="error" role="alert" hidden></p>

          <details class="options" id="options">
            <summary><span class="options-title" data-t="options"></span><span class="options-state" id="options-state"></span></summary>
            <div class="options-body">
              <fieldset class="techniques">
                <legend data-t="techniques"></legend>
                <div class="technique-tools">
                  <button type="button" id="all-on" class="small" data-t="all"></button>
                  <button type="button" id="all-off" class="small" data-t="none"></button>
                </div>
                <div id="technique-list" class="technique-list"></div>
                <label class="every-tld"><input type="checkbox" id="all-tlds"><span data-t="allTlds"></span></label>
              </fieldset>
              <div class="known">
                <label><span data-t="knownNs"></span><input id="known-ns" type="text" dir="ltr" spellcheck="false"></label>
                <label><span data-t="knownMx"></span><input id="known-mx" type="text" dir="ltr" spellcheck="false"></label>
                <p class="hint" data-t="knownHint"></p>
              </div>
              <label class="exclude"><span data-t="exclude"></span>
                <textarea id="exclude" rows="3" dir="ltr" spellcheck="false" aria-describedby="exclude-hint"></textarea>
                <span class="hint" id="exclude-hint" data-t="excludeHint"></span>
              </label>
            </div>
          </details>
        </form>
        <p class="idle-hint" id="idle" data-t="idle"></p>
      </div>

      <aside class="specimen" id="specimen" aria-labelledby="specimen-title">
        <h2 id="specimen-title" data-t="specimenTitle"></h2>
        <div class="specimen-stage" id="specimen-stage">
          <dl class="specimen-pair">
            <div><dt data-t="original"></dt><dd><code dir="ltr" id="specimen-original"></code></dd></div>
            <div><dt data-t="lookalike"></dt><dd><code dir="ltr" class="loupe" id="specimen-candidate"></code><span class="ascii" id="specimen-ascii"></span></dd></div>
          </dl>
          <p class="specimen-how" id="specimen-about"></p>
        </div>
        <div class="specimen-picks" id="specimen-picks" role="group" aria-labelledby="specimen-title"></div>
        <p class="specimen-note" data-t="specimenNote"></p>
      </aside>
    </div>

    <section id="run" class="wrap run" hidden aria-labelledby="results-title">
      <h2 id="results-title" class="visually-hidden" data-t="results"></h2>
      <div class="board">
        <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-t-aria="progress">
          <span id="meter-fill"></span>
        </div>
        <div class="tally" role="group" data-t-aria="filtersLabel">
          <button type="button" class="lead" data-filter="found" aria-pressed="true"><span class="tally-label" data-t="filterFound"></span><span class="tally-figure" id="n-exist">0</span></button>
          <button type="button" data-filter="live" aria-pressed="false"><span class="tally-label" data-t="filterLive"></span><span class="tally-figure" id="n-live">0</span></button>
          <button type="button" data-filter="known" aria-pressed="false"><span class="tally-label" data-t="filterKnown"></span><span class="tally-figure" id="n-yours">0</span></button>
          <button type="button" data-filter="all" aria-pressed="false"><span class="tally-label" data-t="filterAll"></span><span class="tally-figure" id="n-checked">0</span></button>
        </div>
      </div>
      <p id="note" class="note" hidden></p>

      <div class="run-body">
        <div class="run-rail">
          <div class="run-actions">
            <h3 data-t="download"></h3>
            <div class="exports">
              <button type="button" class="small" data-export="csv">CSV</button>
              <button type="button" class="small" data-export="json">JSON</button>
              <button type="button" class="small" data-export="misp">MISP</button>
              <button type="button" class="small" data-export="stix">STIX</button>
            </div>
            <button type="button" class="small copy" id="copy" data-t="copyLink"></button>
          </div>

          <div class="run-info">
            <section class="panel" aria-labelledby="original-title">
              <h3 id="original-title" data-t="original"></h3>
              <div id="original" class="original"></div>
            </section>
            <section class="panel" id="technique-panel" aria-labelledby="technique-title" hidden>
              <h3 id="technique-title" data-t="byTechnique"></h3>
              <ol id="by-technique" class="by-technique"></ol>
            </section>
          </div>
        </div>

        <div class="run-list">
          <ol id="results" class="results"></ol>
          <p id="empty" class="empty" hidden></p>
          <p class="shown" id="shown" hidden></p>
          <button type="button" id="more" class="small more" data-t="more" hidden></button>
        </div>
      </div>
    </section>

    <div class="wrap reference">
      <section class="legend" aria-labelledby="legend-title">
        <h2 id="legend-title" data-t="statusesTitle"></h2>
        <dl id="statuses" class="statuses"></dl>
        <p class="score-note" data-t="scoreAbout"></p>
      </section>

      <section class="story" aria-labelledby="story-title">
        <h2 id="story-title" data-t="aboutTitle"></h2>
        <p data-t="about"></p>
      </section>
    </div>

    <section class="wrap cli" aria-labelledby="cli-title">
      <div class="cli-text">
        <h2 id="cli-title" data-t="cliTitle"></h2>
        <p data-t="cli"></p>
      </div>
      <!-- example.com is the domain reserved for documentation (RFC 2606), never a real brand. -->
      <pre dir="ltr"><code>npx github:SiteQ8/Tawash scan example.com
npx github:SiteQ8/Tawash nrd --keywords watchlist.txt --dns
npx github:SiteQ8/Tawash watch --keywords watchlist.txt --ct --out reports</code></pre>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap foot-grid">
      <p class="privacy"><strong data-t="privacyTitle"></strong> <span data-t="privacy"></span></p>
      <p class="privacy"><strong data-t="disclaimerTitle"></strong> <span data-t="disclaimer"></span></p>
      <p class="links">
        <span data-t="licence"></span>
        <a href="https://github.com/SiteQ8/Tawash" data-t="source"></a>
      </p>
    </div>
  </footer>

  <p class="visually-hidden" id="live" aria-live="polite"></p>
  <script type="module" src="app.js"></script>
</body>
</html>
